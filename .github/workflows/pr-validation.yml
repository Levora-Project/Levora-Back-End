name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  deployment_status:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write
  actions: read

jobs:
  # =========================================================================
  # 1. LINT & FORMAT CHECKS
  # =========================================================================
  lint-and-format:
    name: Lint & Format Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Run ESLint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Check Code Formatting (Prettier)
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Verify Build
        run: pnpm build

  # =========================================================================
  # 2. UNIT, INTEGRATION & E2E TESTS
  # =========================================================================
  test:
    name: Unit, Integration & E2E Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: levora_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/levora_test?schema=public
      DIRECT_URL: postgresql://test_user:test_password@localhost:5432/levora_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      PORT: 3000
      JWT_SECRET: ci-cd-test-jwt-secret-key-minimum-32-chars-long

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Enable CITEXT Extension in Test Database
        run: PGPASSWORD=test_password psql -h localhost -U test_user -d levora_test -c "CREATE EXTENSION IF NOT EXISTS citext;"

      - name: Push Schema to Test Database
        run: pnpm exec prisma db push --skip-generate

      - name: Run Unit & Integration Tests
        run: pnpm test -- --passWithNoTests

      - name: Run E2E Tests
        run: pnpm test:e2e

  # =========================================================================
  # 3. BUILD & TEST CONTAINER
  # =========================================================================
  build-and-test-container:
    name: Build & Test Container
    needs: [test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: levora_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable CITEXT Extension in Test Database
        run: PGPASSWORD=test_password psql -h localhost -U test_user -d levora_test -c "CREATE EXTENSION IF NOT EXISTS citext;"

      - name: Build Docker Image
        run: docker build -t levora-backend:test .

      - name: Run Application Container
        run: |
          docker run -d \
            --name levora-app \
            --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e API_PREFIX=api \
            -e DATABASE_URL="postgresql://test_user:test_password@localhost:5432/levora_test?schema=public" \
            -e DIRECT_URL="postgresql://test_user:test_password@localhost:5432/levora_test?schema=public" \
            -e REDIS_HOST="localhost" \
            -e REDIS_PORT="6379" \
            -e JWT_SECRET="ci-cd-test-jwt-secret-key-minimum-32-chars-long" \
            -e LOG_LEVEL="info" \
            levora-backend:test

      - name: Wait for Container Readiness
        run: |
          echo "Waiting for container to become healthy..."
          TIMEOUT=60
          ELAPSED=0
          until curl -s -f http://localhost:3000/api/v1/health > /dev/null 2>&1; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "::error::Container failed to become healthy within $TIMEOUT seconds."
              docker logs levora-app
              exit 1
            fi
            echo "Waiting for application startup... ($ELAPSED/$TIMEOUT s)"
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          echo "Application container is healthy!"

      - name: Run API Smoke Tests Against Running Container
        run: |
          set -e

          echo "=== 1. Test GET /api/v1/health (Liveness) ==="
          HEALTH_RES=$(curl -s -w "\n%{http_code}" http://localhost:3000/api/v1/health)
          HEALTH_CODE=$(echo "$HEALTH_RES" | tail -n1)
          HEALTH_BODY=$(echo "$HEALTH_RES" | sed '$d')
          echo "Response Code: $HEALTH_CODE"
          echo "Response Body: $HEALTH_BODY"
          if [ "$HEALTH_CODE" != "200" ]; then
            echo "::error::Health probe failed with status $HEALTH_CODE"
            exit 1
          fi

          echo "=== 2. Test GET /api/v1/health/ready (Readiness) ==="
          READY_RES=$(curl -s -w "\n%{http_code}" http://localhost:3000/api/v1/health/ready)
          READY_CODE=$(echo "$READY_RES" | tail -n1)
          READY_BODY=$(echo "$READY_RES" | sed '$d')
          echo "Response Code: $READY_CODE"
          echo "Response Body: $READY_BODY"
          if [ "$READY_CODE" != "200" ]; then
            echo "::error::Readiness probe failed with status $READY_CODE"
            exit 1
          fi

          echo "=== 3. Test POST /api/v1/auth/register ==="
          REG_RES=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"container-test@example.com","password":"Password123!","firstName":"Container","lastName":"Tester"}')
          REG_CODE=$(echo "$REG_RES" | tail -n1)
          REG_BODY=$(echo "$REG_RES" | sed '$d')
          echo "Response Code: $REG_CODE"
          echo "Response Body: $REG_BODY"
          if [ "$REG_CODE" != "201" ]; then
            echo "::error::Registration test failed with status $REG_CODE"
            exit 1
          fi

          echo "=== 4. Test POST /api/v1/auth/login ==="
          LOGIN_RES=$(curl -s -w "\n%{http_code}" -X POST http://localhost:3000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"container-test@example.com","password":"Password123!"}')
          LOGIN_CODE=$(echo "$LOGIN_RES" | tail -n1)
          LOGIN_BODY=$(echo "$LOGIN_RES" | sed '$d')
          echo "Response Code: $LOGIN_CODE"
          echo "Response Body: $LOGIN_BODY"
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "::error::Login test failed with status $LOGIN_CODE"
            exit 1
          fi

          echo "All container API tests passed successfully!"

      - name: Dump Container Logs on Failure
        if: failure()
        run: docker logs levora-app

      - name: Stop Container
        if: always()
        run: docker stop levora-app || true

  # =========================================================================
  # 4. RUN PREVIEW TESTS (Newman Smoke Tests Against Render PR Preview)
  # =========================================================================
  run-preview-tests:
    name: Run Preview Tests (Newman)
    if: |
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment_status.environment == 'preview' || github.event.deployment.environment == 'preview' || github.event.deployment_status.environment_type == 'preview')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman Smoke Tests Against Preview URL
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::No environment_url provided in deployment_status event."
            exit 1
          fi

          # Strip trailing slash if present
          CLEAN_URL="${PREVIEW_URL%/}"
          echo "Executing Newman tests against: $CLEAN_URL/api/v1"

          newman run tests/levora-smoke-tests.json \
            --env-var baseUrl="$CLEAN_URL/api/v1" \
            --reporters cli,json \
            --reporter-json-export newman-report.json

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.json
          retention-days: 7
